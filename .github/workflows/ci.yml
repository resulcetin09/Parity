name: Compile, test & build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install checksum-verified Compact 0.31.1
        run: npm run setup:compact
      - name: Compile contract and generate proving keys
        run: npm run compile
      - name: Committed compiler output matches a fresh compile
        run: git diff --exit-code -- contract/managed
      - run: npm run typecheck
      - name: Compact runtime and application tests
        run: npm test -- --reporter=verbose --reporter=junit --outputFile.junit=test-results/unit.xml
      - name: Build frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm run test:e2e
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            test-results
            playwright-report
          retention-days: 14

  preview-evidence:
    # Re-verifies the recorded Preview deployment against the public indexer.
    # Skipped until deployments/preview.json exists.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: evidence
        run: echo "present=$([ -f deployments/preview.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.evidence.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.evidence.outputs.present == 'true'
        run: npm ci && npm run setup:compact && npm run compile
      - if: steps.evidence.outputs.present == 'true'
        name: Verify Preview deployment against the public indexer
        run: npm run verify:preview
